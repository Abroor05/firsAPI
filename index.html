<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loyiha</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="container">
               <h4 class="logo"> Where in the world? </h4>
               <span class="darkMod">
                <i class="fa-solid fa-moon oy"></i>
                <i class="fa-regular fa-sun quyosh"></i>

                <p class="title">Dark Mode</p>
               </span>
            </div>
        </nav>

        <div class="hero">
            <div class="container">
                <span class="qidiruv">
                    <input type="text" class="search" placeholder="Search for a country…">
                    <i class="fa-solid fa-magnifying-glass lupa"></i>
                </span>
                <select name="continent" id="region" >
                    <option value="" disabled selected>Filter by Region</option>
                    <option value="All">All</option>
                    <option value="Africa">Africa</option>
                    <option value="Americas">America</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="Oceania">Oceania</option>
                  </select>
                  
            </div>
        </div>
    </header>

    <main>
        <section>
            <div class="container">
                <div class="flags">  
            </div>
        </section>
    </main>


</body>

<script src="./js/main.js"></script>
</html>
